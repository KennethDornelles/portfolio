services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: olustack_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portfolio_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: olustack_redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: olustack_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-portfolio_db}
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-portfolio_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      I18N_WEBHOOK_SECRET: ${I18N_WEBHOOK_SECRET:?I18N_WEBHOOK_SECRET must be set}
      I18N_WEBHOOK_TOLERANCE_SECONDS: ${I18N_WEBHOOK_TOLERANCE_SECONDS:-300}
      PORT: ${PORT:-3000}
      BACKEND_URL: http://localhost:${PORT:-3000}
      FRONTEND_URL: http://localhost:4200
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_EXPIRATION: "15m"
      JWT_REFRESH_EXPIRATION: "7d"
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-${ADMIN_EMAIL:-}}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-${ADMIN_PASSWORD:-}}
      NODE_ENV: "development"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
